server {
    listen 8080;
    charset utf-8;
    root /usr/share/nginx/html;
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
